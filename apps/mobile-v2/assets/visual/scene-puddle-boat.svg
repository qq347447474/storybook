<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A white paper boat floats in a rain puddle that reflects warm evening windows.">
  <defs>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223B3A"/>
      <stop offset=".55" stop-color="#3F5754"/>
      <stop offset="1" stop-color="#5C6E68"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C196"/>
      <stop offset=".45" stop-color="#C9927C"/>
      <stop offset="1" stop-color="#7F8B83"/>
    </linearGradient>
    <linearGradient id="boat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF2"/>
      <stop offset="1" stop-color="#EFE1C8"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD79E" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFD79E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59716B" stop-opacity="0"/>
      <stop offset="1" stop-color="#59716B" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="10" r="1" fill="#1A2B2A" opacity=".18"/>
      <circle cx="30" cy="28" r=".8" fill="#1A2B2A" opacity=".14"/>
    </pattern>
    <clipPath id="puddle">
      <path d="M146 430 C 196 368 330 340 462 350 C 570 356 640 330 760 344 C 892 358 1010 388 1058 448 C 1104 506 1062 574 968 604 C 852 640 672 638 528 620 C 388 602 250 588 184 538 C 132 500 118 470 146 430 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#street)"/>

  <!-- far street -->
  <g opacity=".85">
    <path d="M0 300 L0 160 L120 160 L120 220 L240 220 L240 120 L380 120 L380 250 L470 250 L470 180 L600 180 L600 260 L720 260 L720 150 L850 150 L850 230 L980 230 L980 170 L1200 170 L1200 300 Z" fill="#162B2B"/>
    <rect x="272" y="158" width="34" height="42" rx="3" fill="#F4C489" opacity=".8"/>
    <rect x="332" y="178" width="26" height="30" rx="3" fill="#EFB077" opacity=".55"/>
    <rect x="760" y="188" width="40" height="34" rx="3" fill="#F4C489" opacity=".7"/>
    <rect x="900" y="200" width="28" height="30" rx="3" fill="#EFB077" opacity=".5"/>
    <circle cx="1010" cy="250" r="140" fill="url(#windowGlow)" opacity=".65"/>
    <rect x="976" y="204" width="84" height="76" rx="6" fill="#F7C788" opacity=".9"/>
    <path d="M1018 204 V280 M976 242 H1060" stroke="#2B3F3C" stroke-width="6" opacity=".8"/>
  </g>

  <!-- pavement texture -->
  <g stroke="#71827A" stroke-width="2" opacity=".35">
    <path d="M0 330 C 240 312 420 344 620 326 C 820 308 1000 336 1200 318"/>
    <path d="M0 620 C 260 600 470 636 700 614 C 900 596 1070 622 1200 606"/>
  </g>

  <!-- puddle -->
  <g>
    <path d="M146 430 C 196 368 330 340 462 350 C 570 356 640 330 760 344 C 892 358 1010 388 1058 448 C 1104 506 1062 574 968 604 C 852 640 672 638 528 620 C 388 602 250 588 184 538 C 132 500 118 470 146 430 Z" fill="#203A39" opacity=".55"/>
    <g clip-path="url(#puddle)">
      <rect x="100" y="320" width="1000" height="330" fill="url(#water)" opacity=".9"/>
      <rect x="100" y="320" width="1000" height="330" fill="#3E5B57" opacity=".3"/>
      <!-- reflected sky / buildings -->
      <path d="M100 356 C 250 344 340 368 470 354 C 610 338 760 366 1100 346 V430 H100 Z" fill="#F3CDA3" opacity=".5"/>
      <path d="M240 430 V388 H300 V432 M380 424 V376 H428 V426 M560 418 V364 H612 V420 M760 412 V370 H800 V414 M930 420 V380 H986 V424" stroke="#2A3F3D" stroke-width="10" fill="none" opacity=".3"/>
      <rect x="930" y="376" width="76" height="70" rx="4" fill="#F5C58A" opacity=".38"/>
      <path d="M100 470 C 260 456 420 482 600 466 C 780 450 940 478 1100 460 V640 H100 Z" fill="url(#depth)"/>
      <!-- soft light reflection -->
      <ellipse cx="992" cy="530" rx="40" ry="96" fill="#F6C992" opacity=".16"/>
      <ellipse cx="992" cy="512" rx="18" ry="60" fill="#FBE1BA" opacity=".2"/>
      <!-- ripples -->
      <g fill="none" stroke="#FBE9CE" opacity=".55">
        <ellipse cx="570" cy="470" rx="210" ry="34" stroke-width="3"/>
        <ellipse cx="570" cy="476" rx="290" ry="52" stroke-width="2"/>
        <ellipse cx="872" cy="528" rx="74" ry="14" stroke-width="2"/>
        <ellipse cx="872" cy="532" rx="112" ry="22" stroke-width="1.6"/>
        <ellipse cx="320" cy="540" rx="86" ry="16" stroke-width="2"/>
        <ellipse cx="320" cy="544" rx="130" ry="26" stroke-width="1.4"/>
        <ellipse cx="700" cy="574" rx="60" ry="11" stroke-width="1.6"/>
      </g>
      <g fill="#FBE9CE" opacity=".5">
        <circle cx="470" cy="516" r="4"/><circle cx="642" cy="540" r="3"/><circle cx="800" cy="496" r="3.5"/>
        <circle cx="368" cy="470" r="2.5"/><circle cx="950" cy="560" r="3"/>
      </g>
    </g>

    <!-- boat -->
    <g>
      <ellipse cx="536" cy="478" rx="128" ry="18" fill="#2C4442" opacity=".5"/>
      <path d="M430 462 L642 462 L602 496 Q536 506 470 496 Z" fill="url(#boat)" stroke="#D9C6A6" stroke-width="2"/>
      <path d="M522 460 L522 364 L602 436 L522 460" fill="#FFF9EC" stroke="#D9C6A6" stroke-width="2"/>
      <path d="M504 460 L504 392 L458 442 L504 460" fill="#F4E8D3" stroke="#D9C6A6" stroke-width="2"/>
      <path d="M522 364 L522 460" stroke="#D7C3A3" stroke-width="2.6"/>
      <path d="M504 460 L458 442" stroke="#D7C3A3" stroke-width="2.6"/>
      <path d="M430 462 L642 462" stroke="#D7C3A3" stroke-width="2.2"/>
      <path d="M470 479 H602" stroke="#E3D0B1" stroke-width="2.2"/>
      <path d="M522 436 L548 458" stroke="#E0CFB2" stroke-width="2"/>
      <path d="M500 508 q36 10 74 0" stroke="#F7DDB8" stroke-width="3" fill="none" opacity=".55"/>
    </g>

    <!-- leaves -->
    <g>
      <path d="M880 522 C 906 508 936 514 942 534 C 924 548 896 546 880 522 Z" fill="#D9854B" opacity=".9"/>
      <path d="M880 522 C 900 524 922 530 942 534" stroke="#A65E33" stroke-width="2" fill="none"/>
      <path d="M288 494 C 306 480 330 484 336 502 C 320 516 298 512 288 494 Z" fill="#E4A45C" opacity=".85"/>
    </g>

    <!-- scattered leaves -->
    <g opacity=".85">
      <path d="M1040 476 C 1062 460 1090 464 1098 484 C 1078 500 1050 496 1040 476 Z" fill="#D9854B"/>
      <path d="M1040 476 C 1060 478 1080 482 1098 484" stroke="#A65E33" stroke-width="2" fill="none"/>
      <path d="M984 572 C 1000 560 1022 562 1030 578 C 1014 592 992 588 984 572 Z" fill="#E4A45C"/>
    </g>
  </g>

  <!-- rain -->
  <g stroke="#E9F2EC" stroke-linecap="round" opacity=".45">
    <path d="M120 80 l-22 74" stroke-width="3"/><path d="M230 40 l-18 60" stroke-width="2.4"/>
    <path d="M330 96 l-24 80" stroke-width="3"/><path d="M450 52 l-16 54" stroke-width="2.2"/>
    <path d="M560 110 l-24 82" stroke-width="3"/><path d="M680 64 l-18 60" stroke-width="2.4"/>
    <path d="M790 118 l-22 74" stroke-width="2.8"/><path d="M900 70 l-16 54" stroke-width="2.2"/>
    <path d="M1010 124 l-22 76" stroke-width="2.8"/><path d="M1120 88 l-18 60" stroke-width="2.4"/>
    <path d="M70 250 l-18 60" stroke-width="2.4"/><path d="M190 292 l-16 54" stroke-width="2.2"/>
    <path d="M300 260 l-18 60" stroke-width="2.4"/><path d="M430 310 l-16 54" stroke-width="2.2"/>
    <path d="M700 300 l-20 68" stroke-width="2.6"/><path d="M830 280 l-16 54" stroke-width="2.2"/>
    <path d="M960 320 l-18 60" stroke-width="2.4"/><path d="M1130 290 l-16 54" stroke-width="2.2"/>
  </g>
  <g fill="none" stroke="#E9F2EC" stroke-width="2" opacity=".55">
    <circle cx="508" cy="620" r="4"/><circle cx="658" cy="520" r="3"/><circle cx="238" cy="580" r="3.5"/>
    <circle cx="1000" cy="620" r="4"/><circle cx="760" cy="600" r="2.5"/>
  </g>

  <rect width="1200" height="675" fill="url(#grain)"/>
</svg>
