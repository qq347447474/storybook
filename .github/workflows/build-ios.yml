# Build the storyapp iOS package on every push to main.
#
# Signing: `--no-codesign` on purpose. The artifact is an unsigned .ipa that
# Sideloadly (or AltStore) re-signs locally with a free Apple ID — a paid
# Developer Program is not required to get a build onto a device.
#
# macOS runner minutes bill at 10x on private repos; the path filter keeps the
# job off docs-only pushes.

name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-v2/**'
      - 'packages/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter build ipa (unsigned)
    # macos-latest has the widest runner pool; the job is I/O bound (pub get +
    # xcodebuild) and benefits more from allocation than from a pinned image.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Same channel/revision family as the local machine (D:/F/flutter).
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Resolve packages
        working-directory: apps/mobile-v2
        run: flutter pub get

      - name: Build unsigned IPA
        working-directory: apps/mobile-v2
        # --no-codesign: Sideloadly re-signs the artifact with the user's
        # Apple ID. No .p12 / provisioning profile secrets are required.
        run: |
          flutter build ipa --no-codesign --release --build-name=1.0.0 --build-number=${{ github.run_number }}
          echo '--- build/ios tree ---'
          find build/ios -maxdepth 3 -name '*.ipa' -o -name '*.app' | head -20

      - name: Collect artifact
        run: |
          set -e
          mkdir -p out
          echo '--- looking for ipa ---'
          find apps/mobile-v2/build/ios -name '*.ipa' -print || true
          ipa=$(find apps/mobile-v2/build/ios -name '*.ipa' | head -1)
          dest="out/storyapp-ios-${{ github.run_number }}.ipa"
          if [ -n "$ipa" ]; then
            cp "$ipa" "$dest"
          else
            # flutter --no-codesign can stop at a bare .app. Sideloadly needs
            # a real IPA container: Payload/<name>.app zipped with no root dir.
            echo '::warning::no .ipa from build; wrapping .app into one'
            app=$(find apps/mobile-v2/build/ios -name '*.app' -type d | head -1)
            if [ -z "$app" ]; then
              echo '::error::neither .ipa nor .app found under build/ios'
              find apps/mobile-v2/build/ios -maxdepth 4 | head -40
              exit 1
            fi
            stage=$(mktemp -d)
            mkdir -p "$stage/Payload"
            cp -R "$app" "$stage/Payload/"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/$dest" Payload)
            rm -rf "$stage"
          fi
          ls -lh out/
          unzip -l "$dest" | grep -E 'Payload/.+\.app/' | head -3
          echo "IPA ready"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: storyapp-ios-${{ github.run_number }}
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 30
